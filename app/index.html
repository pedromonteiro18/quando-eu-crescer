<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>English with Clara</title>
<meta name="description" content="Learn English with Clara — listening, speaking, reading and writing, from age four upwards.">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#FAF7F2">

<!-- Generated by build/build-fonts.mjs. Inlined, so the page fetches nothing
     but its own files — and a face can never silently fail to arrive. -->
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="styles.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='18' fill='%2315161D'/><text x='50' y='72' font-size='62' font-family='Georgia,serif' fill='%23FAF7F2' text-anchor='middle'>C</text></svg>">
</head>
<body>

<a class="skip" href="#stage">Skip to content</a>

<!-- Everything lives inside one phone-shaped screen. On a phone it simply fills
     the viewport; on a desktop it sits in the middle of the desk, bezel and all,
     because this is a phone app that happens to be reachable from a browser. -->
<div class="device" id="device">
<span class="device__speaker" aria-hidden="true"></span>

<header class="bar" id="bar">
  <button class="bar__brand" id="brand" type="button" aria-label="English with Clara — home">
    <span class="bar__clara" id="bar-clara" aria-hidden="true"></span>
    <span class="bar__name">English <em>with</em> Clara</span>
  </button>

  <div class="bar__right">
    <div class="streak" id="streak" hidden></div>
    <button class="gear" id="gear" type="button" aria-label="Teacher area — press and hold">
      <span class="gear__ring" id="gear-ring" aria-hidden="true"></span>
      <span aria-hidden="true">⚙</span>
    </button>
  </div>
</header>

<!-- Silence is the one failure this app cannot notice on its own, so when it CAN
     measure it the learner is told rather than left listening to nothing. -->
<div class="alarm" id="alarm" hidden>
  <span class="alarm__icon" aria-hidden="true">🔇</span>
  <span class="alarm__text" id="alarm-text"></span>
  <button class="alarm__btn" id="alarm-btn" type="button"></button>
</div>

<main class="stage" id="stage" tabindex="-1"></main>

<canvas class="fx" id="fx" aria-hidden="true"></canvas>

<!-- What to check when there is no sound. The first item is the iPhone ringer
     switch, because Web Audio obeys it, nothing in a web page can see it, and
     every measurement the app can take still reports success. -->
<div class="sheet" id="sound" hidden role="dialog" aria-modal="true" aria-labelledby="sound-h">
  <div class="sheet__box">
    <div class="sheet__head">
      <h2 id="sound-h">No sound?</h2>
      <button class="btn btn--quiet" id="sound-close" type="button">Close</button>
    </div>
    <div class="sheet__body" id="sound-body"></div>
  </div>
</div>

<!-- Teacher area. Holds the review gate: an unreviewed category is invisible to
     a learner and shows up flagged here, which is where a reviewer wants it. -->
<div class="sheet" id="teacher" hidden role="dialog" aria-modal="true" aria-labelledby="teacher-h">
  <div class="sheet__box">
    <div class="sheet__head">
      <h2 id="teacher-h">Teacher</h2>
      <button class="btn btn--quiet" id="teacher-close" type="button">Close</button>
    </div>
    <div class="sheet__body" id="teacher-body"></div>
  </div>
</div>

</div><!-- /.device -->

<script type="module" src="js/app.js"></script>
<noscript>
  <p style="padding:24px;font:16px system-ui">English with Clara needs JavaScript. Nothing is sent anywhere — it all runs on this device.</p>
</noscript>
</body>
</html>
